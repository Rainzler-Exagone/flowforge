
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write


jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/flowforge-api:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/flowforge-api:latest \
            .

      - name: Build Worker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -f Dockerfile.worker \
            -t ghcr.io/${{ github.repository_owner }}/flowforge-worker:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/flowforge-worker:latest \
            .

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/flowforge-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/flowforge-api:latest

      - name: Push Worker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/flowforge-worker:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/flowforge-worker:latest

